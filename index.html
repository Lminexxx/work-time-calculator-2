<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務時間計算</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            background: #fffafc;
            color: #4a4146;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
            color: #6b5360;
        }

        h2 {
            margin-top: 35px;
            font-size: 22px;
            color: #6b5360;
        }

        p {
            margin-bottom: 8px;
        }

        input,
        select {
            display: block;
            width: 180px;
            height: 42px;
            box-sizing: border-box;
            font-size: 16px;
            padding: 8px;
            margin-bottom: 20px;
            border: 1px solid #d8c8d0;
            border-radius: 10px;
            background: #ffffff;
            color: #4a4146;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #b99aaa;
        }

        /*
         * 出勤・退勤を横並びにして、
         * 枠同士をピッタリくっつける
         */
        .time-row {
            display: flex;
            gap: 0;
            align-items: flex-start;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .time-row > div {
            flex: 0 0 180px;
        }

        /*
         * 横並び部分だけ枠を接続した見た目にする
         */
        .time-row input {
            border-radius: 0;
        }

        .time-row > div:first-child input {
            border-radius: 10px 0 0 10px;
        }

        .time-row > div:last-child input {
            border-radius: 0 10px 10px 0;
        }

        button {
            font-size: 18px;
            padding: 10px 24px;
            margin-top: 10px;
            margin-right: 8px;
            border: none;
            border-radius: 10px;
            background: #d9b8c8;
            color: #ffffff;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        #reset {
            background: #c8b9c0;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #dfccd5;
            border-radius: 10px;
            min-height: 30px;
            background: #ffffff;
        }

        #history {
            margin-top: 15px;
        }

        .history-item {
            border: 1px solid #dfccd5;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: #ffffff;
            line-height: 1.6;
        }

        .history-date {
            font-weight: bold;
        }

        .history-time {
            font-size: 17px;
        }

        .history-result {
            font-size: 16px;
        }
.history-delete {
    font-size: 14px;
    padding: 6px 12px;
    margin-top: 8px;
    background: #c8b9c0;
}
        #clearHistory {
            font-size: 16px;
            padding: 8px 16px;
            background: #b9a5ae;
        }
    </style>
</head>

<body>

    <h1>勤務時間計算</h1>

    <p>勤務日</p>
    <input type="date" id="date">

    <div class="time-row">

        <div>
            <p>出勤時間</p>
            <input type="time" id="start">
        </div>

        <div>
            <p>退勤時間</p>
            <input type="time" id="end">
        </div>

    </div>

    <p>休憩時間</p>
    <select id="breakMode">
        <option value="auto">自動</option>
        <option value="0">なし</option>
        <option value="15">15分</option>
        <option value="30">30分</option>
        <option value="45">45分</option>
        <option value="60">60分</option>
    </select>

    <button id="calculate">計算</button>
    <button id="reset">リセット</button>

    <p id="result"></p>

    <h2>履歴</h2>

    <div id="history"></div>

    <button id="clearHistory">履歴を全削除</button>

    <script>
        const dateInput = document.getElementById('date');
        const startInput = document.getElementById('start');
        const endInput = document.getElementById('end');
        const breakModeInput = document.getElementById('breakMode');

        const calculateButton =
            document.getElementById('calculate');

        const resetButton =
            document.getElementById('reset');

        const result =
            document.getElementById('result');

        const history =
            document.getElementById('history');

        const clearHistoryButton =
            document.getElementById('clearHistory');


        /*
         * 今日の日付を取得
         */
        function getToday() {

            const today = new Date();

            const year = today.getFullYear();

            const month =
                String(today.getMonth() + 1).padStart(2, '0');

            const day =
                String(today.getDate()).padStart(2, '0');

            return year + '-' + month + '-' + day;
        }


        /*
         * 前回の入力を読み込む
         */
        const savedData =
            localStorage.getItem('workTimeData');

        if (savedData) {

            const data = JSON.parse(savedData);

            dateInput.value = data.date || getToday();

            startInput.value = data.start || '';

            endInput.value = data.end || '';

            breakModeInput.value =
                data.breakMode || 'auto';

            result.textContent =
                data.result || '';

        } else {

            dateInput.value = getToday();
        }


        /*
         * 履歴を表示
         */
        function displayHistory() {

            const savedHistory =
                localStorage.getItem('workTimeHistory');

            if (!savedHistory) {

                history.innerHTML =
                    '<p>まだ履歴はありません。</p>';

                return;
            }

            const historyData =
                JSON.parse(savedHistory);

            if (historyData.length === 0) {

                history.innerHTML =
                    '<p>まだ履歴はありません。</p>';

                return;
            }

            history.innerHTML = '';

            historyData.forEach(function(item) {

                const div =
                    document.createElement('div');

                div.className =
                    'history-item';


                const dateDiv =
                    document.createElement('div');

                dateDiv.className =
                    'history-date';

                dateDiv.textContent =
                    item.date;


                const timeDiv =
                    document.createElement('div');

                timeDiv.className =
                    'history-time';

                timeDiv.textContent =
                    item.start + ' → ' + item.end;


                const resultDiv =
                    document.createElement('div');

                resultDiv.className =
                    'history-result';

                resultDiv.textContent =
                    '休憩 ' +
                    item.breakTime +
                    '分　' +
                    item.result;


                div.appendChild(dateDiv);

div.appendChild(timeDiv);

div.appendChild(resultDiv);


const deleteButton =
    document.createElement('button');

deleteButton.className =
    'history-delete';

deleteButton.textContent =
    '削除';


deleteButton.addEventListener(
    'click',
    function() {

        const savedHistory =
            JSON.parse(
                localStorage.getItem(
                    'workTimeHistory'
                ) || '[]'
            );


        savedHistory.splice(
            historyData.indexOf(item),
            1
        );


        localStorage.setItem(
            'workTimeHistory',
            JSON.stringify(savedHistory)
        );


        displayHistory();
    }
);


div.appendChild(deleteButton);

history.appendChild(div);
            });
        }


        displayHistory();


        /*
         * 計算
         */
        calculateButton.addEventListener(
            'click',
            function() {

                const date =
                    dateInput.value;

                const start =
                    startInput.value;

                const end =
                    endInput.value;

                const breakMode =
                    breakModeInput.value;


                if (date === '') {

                    result.textContent =
                        '勤務日を入力してください';

                    return;
                }


                if (start === '' || end === '') {

                    result.textContent =
                        '出勤時間と退勤時間を入力してください';

                    return;
                }


                /*
                 * 時刻を分に変換
                 */
                const startParts =
                    start.split(':');

                const endParts =
                    end.split(':');


                const startMinutes =
                    Number(startParts[0]) * 60 +
                    Number(startParts[1]);


                const endMinutes =
                    Number(endParts[0]) * 60 +
                    Number(endParts[1]);


                /*
                 * 勤務時間
                 */
                let elapsedMinutes =
                    endMinutes - startMinutes;


                /*
                 * 日をまたぐ勤務
                 */
                if (elapsedMinutes < 0) {

                    elapsedMinutes += 24 * 60;
                }


                /*
                 * 休憩時間
                 */
                let breakTime;


                if (breakMode === 'auto') {

                    /*
                     * 自動休憩
                     *
                     * 6時間以下 → 0分
                     * 6時間超 → 45分
                     * 45分では実働8時間を超える場合 → 60分
                     */

                    if (elapsedMinutes <= 6 * 60) {

                        breakTime = 0;

                    } else if (
                        elapsedMinutes - 45 <= 8 * 60
                    ) {

                        breakTime = 45;

                    } else {

                        breakTime = 60;
                    }

                } else {

                    breakTime =
                        Number(breakMode);
                }


                /*
                 * 実働時間
                 */
                const workMinutes =
                    elapsedMinutes - breakTime;


                if (workMinutes < 0) {

                    result.textContent =
                        '休憩時間が長すぎます';

                    return;
                }


                const hours =
                    Math.floor(workMinutes / 60);

                const minutes =
                    workMinutes % 60;


                const resultText =
                    '実働時間：' +
                    hours +
                    '時間' +
                    minutes +
                    '分';


                result.textContent =
                    resultText +
                    '（休憩' +
                    breakTime +
                    '分）';


                /*
                 * 前回の入力を保存
                 */
                localStorage.setItem(
                    'workTimeData',
                    JSON.stringify({

                        date: date,

                        start: start,

                        end: end,

                        breakMode: breakMode,

                        result:
                            resultText +
                            '（休憩' +
                            breakTime +
                            '分）'
                    })
                );


                /*
                 * 履歴を読み込む
                 */
                let historyData =
                    JSON.parse(
                        localStorage.getItem(
                            'workTimeHistory'
                        ) || '[]'
                    );


                /*
                 * 履歴に追加
                 */
                historyData.unshift({

                    date: date,

                    start: start,

                    end: end,

                    breakTime: breakTime,

                    result: resultText
                });


                /*
                 * 履歴を保存
                 */
                localStorage.setItem(
                    'workTimeHistory',
                    JSON.stringify(historyData)
                );


                displayHistory();
            }
        );


        /*
         * リセット
         */
        resetButton.addEventListener(
            'click',
            function() {

                dateInput.value =
                    getToday();

                startInput.value = '';

                endInput.value = '';

                breakModeInput.value =
                    'auto';

                result.textContent = '';


                /*
                 * 前回入力だけ削除
                 * 履歴は残す
                 */
                localStorage.removeItem(
                    'workTimeData'
                );
            }
        );


        /*
         * 履歴を全削除
         */
        clearHistoryButton.addEventListener(
            'click',
            function() {

                const shouldClear =
                    confirm(
                        '履歴をすべて削除しますか？'
                    );


                if (!shouldClear) {
                    return;
                }


                localStorage.removeItem(
                    'workTimeHistory'
                );


                displayHistory();
            }
        );

    </script>

</body>
</html>
