<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務時間計算</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        p {
            margin-bottom: 8px;
        }

        input,
        select {
            display: block;
            width: 180px;
            height: 42px;
            box-sizing: border-box;
            font-size: 16px;
            padding: 8px;
            margin-bottom: 20px;
        }

        button {
            font-size: 18px;
            padding: 10px 24px;
            margin-top: 10px;
            margin-right: 8px;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            min-height: 30px;
        }
    </style>
</head>

<body>

    <h1>勤務時間計算</h1>

    <p>出勤時間</p>
    <input type="time" id="start">

    <p>退勤時間</p>
    <input type="time" id="end">

    <p>休憩時間</p>
    <select id="break">
        <option value="0">なし</option>
        <option value="15">15分</option>
        <option value="30">30分</option>
        <option value="45">45分</option>
        <option value="60">60分</option>
    </select>

    <button id="calculate">計算</button>
    <button id="reset">リセット</button>

    <p id="result"></p>

    <script>
        const startInput = document.getElementById('start');
        const endInput = document.getElementById('end');
        const breakInput = document.getElementById('break');
        const calculateButton = document.getElementById('calculate');
        const resetButton = document.getElementById('reset');
        const result = document.getElementById('result');

        // 前回の記録を読み込む
        const savedData = localStorage.getItem('workTimeData');

        if (savedData) {
            const data = JSON.parse(savedData);

            startInput.value = data.start;
            endInput.value = data.end;
            breakInput.value = data.breakTime;
            result.textContent = data.result;
        }

        calculateButton.addEventListener('click', function() {

            const start = startInput.value;
            const end = endInput.value;
            const breakTime = Number(breakInput.value);

            if (start === '' || end === '') {
                result.textContent = '出勤時間と退勤時間を入力してください';
                return;
            }

            const startParts = start.split(':');
            const endParts = end.split(':');

            const startMinutes =
                Number(startParts[0]) * 60 +
                Number(startParts[1]);

            const endMinutes =
                Number(endParts[0]) * 60 +
                Number(endParts[1]);

            let workMinutes = endMinutes - startMinutes;

            if (workMinutes < 0) {
                workMinutes += 24 * 60;
            }

            workMinutes -= breakTime;

            if (workMinutes < 0) {
                result.textContent = '休憩時間が長すぎます';
                return;
            }

            const hours = Math.floor(workMinutes / 60);
            const minutes = workMinutes % 60;

            const resultText =
                '実働時間：' + hours + '時間' + minutes + '分';

            result.textContent = resultText;

            // 今回の記録を保存
            localStorage.setItem('workTimeData', JSON.stringify({
                start: start,
                end: end,
                breakTime: breakTime,
                result: resultText
            }));
        });

        resetButton.addEventListener('click', function() {
            startInput.value = '';
            endInput.value = '';
            breakInput.value = '0';
            result.textContent = '';

            // 保存していた前回の記録も削除
            localStorage.removeItem('workTimeData');
        });
    </script>

</body>
</html>
