<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務時間計算</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        h2 {
            margin-top: 35px;
            font-size: 22px;
        }

        p {
            margin-bottom: 8px;
        }

        input,
        select {
            display: block;
            width: 180px;
            height: 42px;
            box-sizing: border-box;
            font-size: 16px;
            padding: 8px;
            margin-bottom: 20px;
        }

        button {
            font-size: 18px;
            padding: 10px 24px;
            margin-top: 10px;
            margin-right: 8px;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            min-height: 30px;
        }

        #history {
            margin-top: 15px;
        }

        .history-item {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        #clearHistory {
            font-size: 16px;
            padding: 8px 16px;
        }
    </style>
</head>

<body>

    <h1>勤務時間計算</h1>

    <p>勤務日</p>
    <input type="date" id="date">

    <p>出勤時間</p>
    <input type="time" id="start">

    <p>退勤時間</p>
    <input type="time" id="end">

    <p>休憩時間</p>
    <select id="breakMode">
        <option value="auto">自動</option>
        <option value="0">なし</option>
        <option value="15">15分</option>
        <option value="30">30分</option>
        <option value="45">45分</option>
        <option value="60">60分</option>
    </select>

    <button id="calculate">計算</button>
    <button id="reset">リセット</button>

    <p id="result"></p>

    <h2>履歴</h2>

    <div id="history"></div>

    <button id="clearHistory">履歴を全削除</button>

    <script>
        const dateInput = document.getElementById('date');
        const startInput = document.getElementById('start');
        const endInput = document.getElementById('end');
        const breakModeInput = document.getElementById('breakMode');
        const calculateButton = document.getElementById('calculate');
        const resetButton = document.getElementById('reset');
        const result = document.getElementById('result');
        const history = document.getElementById('history');
        const clearHistoryButton = document.getElementById('clearHistory');

        // 前回の入力を読み込む
        const savedData = localStorage.getItem('workTimeData');

        if (savedData) {
            const data = JSON.parse(savedData);

            dateInput.value = data.date || '';
            startInput.value = data.start || '';
            endInput.value = data.end || '';
            breakModeInput.value = data.breakMode || 'auto';
            result.textContent = data.result || '';
        }

        // 履歴を表示
        function displayHistory() {
            const savedHistory = localStorage.getItem('workTimeHistory');

            if (!savedHistory) {
                history.innerHTML = '<p>まだ履歴はありません。</p>';
                return;
            }

            const historyData = JSON.parse(savedHistory);

            if (historyData.length === 0) {
                history.innerHTML = '<p>まだ履歴はありません。</p>';
                return;
            }

            history.innerHTML = '';

            historyData.forEach(function(item) {
                const div = document.createElement('div');
                div.className = 'history-item';

                div.textContent =
                    item.date + '　' +
                    item.start + ' → ' +
                    item.end +
                    '　休憩' + item.breakTime + '分　' +
                    item.result;

                history.appendChild(div);
            });
        }

        displayHistory();

        calculateButton.addEventListener('click', function() {

            const date = dateInput.value;
            const start = startInput.value;
            const end = endInput.value;
            const breakMode = breakModeInput.value;

            if (date === '') {
                result.textContent = '勤務日を入力してください';
                return;
            }

            if (start === '' || end === '') {
                result.textContent = '出勤時間と退勤時間を入力してください';
                return;
            }

            const startParts = start.split(':');
            const endParts = end.split(':');

            const startMinutes =
                Number(startParts[0]) * 60 +
                Number(startParts[1]);

            const endMinutes =
                Number(endParts[0]) * 60 +
                Number(endParts[1]);

            let elapsedMinutes = endMinutes - startMinutes;

            // 日をまたぐ勤務
            if (elapsedMinutes < 0) {
                elapsedMinutes += 24 * 60;
            }

            let breakTime;

            if (breakMode === 'auto') {

                /*
                 * 自動の場合
                 *
                 * 休憩なしで計算すると
                 * 6時間以下 → 休憩0分
                 * 6時間超 → 45分以上必要
                 * 8時間超 → 60分以上必要
                 *
                 * ただし、休憩を入れると実労働時間が変わるため、
                 * 45分を入れても8時間を超える場合は60分にする。
                 */

                if (elapsedMinutes <= 6 * 60) {
                    breakTime = 0;

                } else if (elapsedMinutes - 45 <= 8 * 60) {
                    breakTime = 45;

                } else {
                    breakTime = 60;
                }

            } else {
                // 手動の場合
                breakTime = Number(breakMode);
            }

            const workMinutes = elapsedMinutes - breakTime;

            if (workMinutes < 0) {
                result.textContent = '休憩時間が長すぎます';
                return;
            }

            const hours = Math.floor(workMinutes / 60);
            const minutes = workMinutes % 60;

            const resultText =
                '実働時間：' + hours + '時間' + minutes + '分';

            result.textContent =
                resultText + '（休憩' + breakTime + '分）';

            // 前回の入力を保存
            localStorage.setItem('workTimeData', JSON.stringify({
                date: date,
                start: start,
                end: end,
                breakMode: breakMode,
                result: resultText + '（休憩' + breakTime + '分）'
            }));

            // 履歴を読み込む
            let historyData = JSON.parse(
                localStorage.getItem('workTimeHistory') || '[]'
            );

            // 新しい履歴を追加
            historyData.unshift({
                date: date,
                start: start,
                end: end,
                breakTime: breakTime,
                result: resultText
            });

            // 履歴を保存
            localStorage.setItem(
                'workTimeHistory',
                JSON.stringify(historyData)
            );

            displayHistory();
        });

        resetButton.addEventListener('click', function() {
            dateInput.value = '';
            startInput.value = '';
            endInput.value = '';
            breakModeInput.value = 'auto';
            result.textContent = '';

            localStorage.removeItem('workTimeData');
        });

        clearHistoryButton.addEventListener('click', function() {
            localStorage.removeItem('workTimeHistory');
            displayHistory();
        });
    </script>

</body>
</html>
